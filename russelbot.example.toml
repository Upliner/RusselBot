# Example config for RusselBot. Copy to russelbot.toml and edit.

# Grid login URL. Leave out for Second Life (Agni):
#   https://login.agni.lindenlab.com/cgi-bin/login.cgi
# A local OpenSim standalone listens here by default:
login_url = "http://127.0.0.1:9000/"

# Avatar name: "First Last", or a single word (the last name is then "Resident").
user = "Sit Bot"

# Exactly one of `password` or `password_hash`.
# Generate the hash with `rslbot hash` so the plain password is never stored.
password = "secret"
# password_hash = "$1$5ebe2294ecd0e0f08eab7690d2a6ee69"

# Optional: where the avatar starts out: region name and coordinates inside
# it, always both. The bot logs in there and teleports there when the login
# lands elsewhere. With a `sit` object, pick coordinates close to it, or the
# sit may fail. Whether the bot holds the place afterwards is up to `persist`,
# below.
region = "Target"
position = [128.0, 128.0, 25.0]

# Without `region` and `position`, `start` says where the first login puts
# the avatar: "home" for its home location, "latest" for the place it was
# last at. Default: "latest".
# start = "home"

# Optional: what to sit on: the UUID of an object, or "ground". Without it
# the bot does not sit the avatar anywhere by itself.
sit = "00000000-0000-0000-0000-000000000000"
# sit = "ground"

# Optional: what the bot holds once it has got to the place above (logged in,
# and seated when `sit` is set). It returns to what it holds after a kick, a
# region restart or being moved to another region, and sits again when
# unseated. `rslbot ctl persist` sets or changes it while the bot runs.
#   "off"  (or false) nothing: the bot goes to the place above once and
#          leaves the avatar alone from then on. This is the default.
#   "cfg"  `position` and `sit` exactly as written above; without `position`,
#          the place the first login arrived at.
#   "cur"  the position and the seat the simulator reported at that moment.
# An array gives the position and the seat separately, as does the [persist]
# table at the end of this file.
# persist = "cfg"
#   persist = "cur"
#   persist = ["cfg", "cur"]

# Optional: record what the avatar hears and is told. Every message is also
# written to standard error. The files are tab-separated, appended to, and
# created when missing; relative paths are relative to the working directory.
# log_chat = "chat.tsv"
# log_im = "im.tsv"

# Optional: after each login, also fetch instant messages that were stored
# while the avatar was offline. This removes them from the grid, so a viewer
# logging in as this avatar later will not see them. Off by default.
# fetch_offline_im = true

# Optional: listen on a local control socket, so that `rslbot ctl say ...` and
# `rslbot ctl im ...` can make the avatar talk while the bot runs. The socket
# is ~/russelbot-ctl (127.0.0.1:47115 on Windows) unless the environment
# variable RUSSELBOT_SOCK names another. Off by default.
# socket = true

# Optional: how many minutes after `rslbot ctl requesttp <avatar>` the bot
# still accepts that avatar's teleport offer by itself. Default: 10.
# requesttp_timeout = 10

# Optional: learn the objects within this many metres (1 to 1024) as soon as
# the avatar enters a region, so that `rslbot ctl touch <uuid>` answers at
# once. This costs traffic all the time. Without it the bot learns the
# objects within 32 metres when `touch` is first used.
# scan_distance = 64

# Optional: after each login the bot reads the avatar's Current Outfit folder
# and attaches again the objects it lists that the simulator did not bring,
# as a viewer does. Only where the grid keeps that folder up to date (Second
# Life); elsewhere this does nothing. On by default; `false` switches it off.
# restore_attachments = false

# Optional: RLV (the RestrainedLove API). With `true` the bot reads the `@`
# commands that scripted objects the avatar owns say to their owner, answers
# their version queries, and carries out forced sits, stands, teleports and
# detaches. Any such object, worn or rezzed nearby, can then move the avatar
# and take things off it. Off by default; `rslbot ctl rlv mode on` switches
# it on while the bot runs.
# rlv = true

# `persist` as a table. A table has to come after all the keys above.
#   atstart   Whether the bot holds anything once it has got to the place
#             above. True when `position` or `sit` is given and false
#             otherwise; `atstart = true` alone is `persist = "cur"`.
#   position  "cur" or "cfg", as in the array form. One that is left out is
#   sit       "cur".
#   rlv       What a forced RLV sit, stand or teleport does to the place the
#             bot holds: "drop" (the default) makes it stop holding,
#             "follow" makes the result the place it holds. It says nothing
#             about `atstart`. `rslbot ctl rlv persist` changes it while the
#             bot runs.
# [persist]
# atstart = true
# position = "cur"
# sit = "cfg"
# rlv = "follow"
