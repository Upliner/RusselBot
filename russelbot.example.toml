# Example config for RusselBot. Copy to russelbot.toml and edit.

# Grid login URL. Leave out for Second Life (Agni):
#   https://login.agni.lindenlab.com/cgi-bin/login.cgi
# A local OpenSim standalone listens here by default:
login_url = "http://127.0.0.1:9000/"

# Avatar name: "First Last", or a single word (the last name is then "Resident").
user = "Sit Bot"

# Exactly one of `password` or `password_hash`.
# Generate the hash with `rslbot hash` so the plain password is never stored.
password = "secret"
# password_hash = "$1$5ebe2294ecd0e0f08eab7690d2a6ee69"

# Optional: where the avatar starts out: region name and coordinates inside
# it, always both. The bot logs in there and teleports there when the login
# lands elsewhere. With a `sit` object, pick coordinates close to it, or the
# sit may fail. Whether the bot holds the place afterwards is up to a
# `persist` command in the startup script, below.
region = "Target"
position = [128.0, 128.0, 25.0]

# Without `region` and `position`, `start` says where the first login puts
# the avatar: "home" for its home location, "latest" for the place it was
# last at. Default: "latest".
# start = "home"

# Optional: what to sit on: the UUID of an object, or "ground". Without it
# the bot does not sit the avatar anywhere by itself.
sit = "00000000-0000-0000-0000-000000000000"
# sit = "ground"

# Optional: record what the avatar hears and is told, and its L$
# transactions: see the table `[logs]` at the end of this file.

# Optional: after each login, also fetch instant messages that were stored
# while the avatar was offline. This removes them from the grid, so a viewer
# logging in as this avatar later will not see them. Off by default.
# fetch_offline_im = true

# Optional: listen on a local control socket, so that `rslbot ctl say ...` and
# `rslbot ctl im ...` can make the avatar talk while the bot runs. The socket
# is ~/russelbot-ctl (127.0.0.1:47115 on Windows) unless the environment
# variable RUSSELBOT_SOCK names another. Off by default.
# socket = true

# Optional: how many minutes after `rslbot ctl requesttp <avatar>` the bot
# still accepts that avatar's teleport offer by itself. Default: 10.
# requesttp_timeout = 10

# Optional: learn the objects within this many metres (1 to 1024) as soon as
# the avatar enters a region, so that `rslbot ctl touch <uuid>` and
# `rslbot ctl scan` answer at once. This costs traffic all the time. Without
# it the bot learns the objects within 32 metres when `touch` or `scan` is
# first used; `scan <distance>` reaches further for one stay in a region.
# scan_distance = 64

# Optional: after each login the bot reads the avatar's Current Outfit folder
# and attaches again the objects it lists that the simulator did not bring,
# as a viewer does. Only where the grid keeps that folder up to date (Second
# Life); elsewhere this does nothing. On by default; `false` switches it off.
# restore_attachments = false

# Optional: the startup script: commands the bot carries out by itself when
# it starts, one per line, written as `rslbot ctl` takes them but without
# `rslbot ctl` in front. An argument with spaces goes in double quotes, and a
# line end inside double quotes belongs to the argument. Blank lines and
# lines that start with `#` are skipped. Everything `rslbot ctl` can do, the
# script can do; none of what `rslbot ctl` changes is saved, so what the bot
# is to start with belongs here.
#
# The setting commands at the head of the script, `perms`, `autoreply` and
# `rlv` (other than `rlv cmd`), are carried out before the first login. One
# that is refused is a config error: the bot does not start. Put them first.
#
# From the first other command on, the script waits until the avatar is at
# the place above (logged in, and seated when `sit` is set), and is then
# carried out in order, each command after the answer of the one before. A
# command that is refused stops the script there; the bot keeps running.
# The script runs once, not again after the avatar was kicked and has come
# back. If `rslbot ctl` moves the avatar or persists a place before the
# avatar is in place, the rest of the script is not carried out.
#
# Write it as a TOML literal string, between ''' and ''': there a backslash
# and a double quote are the script's own. Like every key, it has to come
# before the tables at the end of this file.
#
#   rlv mode on                 RLV (the RestrainedLove API): the bot reads
#                               the `@` commands that scripted objects the
#                               avatar owns say to their owner, answers their
#                               version queries, and carries out forced sits,
#                               stands, teleports and detaches. Any such
#                               object, worn or rezzed nearby, can then move
#                               the avatar and take things off it.
#   rlv persist follow          A forced RLV sit, stand or teleport makes its
#                               result the place the bot holds. Without it
#                               (`drop`) the bot stops holding.
#   rlv persist override sit tp What the bot does by itself to get back to
#                               the place it holds whatever RLV restrictions
#                               say: its sits there, its teleports there.
#                               Without it a restriction such as `@tploc=n`
#                               holds the bot where it is.
#   perms autoaccept KIND WHO   Which requests the bot accepts by itself;
#                               without these every request waits for
#                               `rslbot ctl accept KIND`. KIND is `tp` (an
#                               avatar's teleport offer), `inventory` (an
#                               inventory offer), what a script asks for:
#                               `anim`, `attach`, `controls`, `camera`, or
#                               `group` (an invitation into a group). WHO
#                               is `all`, or avatar names and UUIDs; an
#                               avatar stands for every object it owns too,
#                               and a group's UUID for its invitations. An
#                               invitation that costs L$ always waits.
#   perms revoke KIND WHO       After `perms autoaccept KIND all`: who is
#                               never accepted by itself.
#   autoreply message TEXT      The bot answers an avatar that sends it an
#                               instant message with TEXT, as a viewer's Do
#                               Not Disturb autoresponse does,
#   autoreply pause DURATION    and then stays quiet towards that avatar for
#                               `90s`, `30m`, `2h`, `1h30m` (default 1h), or
#                               `0` to answer every message.
#   persist [LOCATION] [SIT]    What the bot holds from then on: it returns
#                               there after a kick, a region restart or
#                               being moved to another region, and sits
#                               again when unseated. Each is `cur` (what the
#                               simulator reports at that moment; the
#                               default) or `cfg` (`position` and `sit` as
#                               written above), or a place and a seat in
#                               full. Without a `persist` command the bot
#                               goes to the place above once and leaves the
#                               avatar alone from then on.
#
# startup = '''
# # Settings: before the first login.
# rlv mode on
# rlv persist follow
# rlv persist override sit tp
# perms autoaccept tp "Jane Doe"
# perms autoaccept inventory "Owner Resident" 11111111-2222-3333-4444-555555555555
# perms autoaccept anim all
# perms revoke anim 01234567-9abc-defe-dcba-987654321000
# perms autoaccept attach all
# perms autoaccept group "Jane Doe"
# autoreply message Hello, I'm bot. I won't respond to you in next 2 hours
# autoreply pause 2h
# # The rest: once the avatar is in place.
# persist cur cfg
# '''

# The same script in a file of its own, in place of `startup`. A relative
# path is relative to the working directory.
# startup_file = "startup.rsl"

# Deprecated: the keys `persist`, `rlv`, `[perms]` and `[autoreply]` are the
# older way to say what the startup script says. They still work as they
# did and are applied before the script, and for each of them the bot logs,
# when it starts, the script commands to write instead:
#   persist = "cur", "cfg", ["cfg", "cur"]    persist cur cur, persist cfg cfg,
#     and `position`, `sit` under [persist]     persist cfg cur
#   `rlv` under [persist]                     rlv persist follow
#   `override` under [persist]                rlv persist override sit tp
#   rlv = true                                rlv mode on
#   [perms.autoaccept]                        perms autoaccept KIND all | WHO...
#   [perms.except]                            perms revoke KIND WHO...
#   [autoreply]                               autoreply message TEXT
#                                             autoreply pause DURATION
# The keys `log_chat` and `log_im` are the older spellings of `chat` and
# `im` in the table `[logs]`. They still work; the bot logs, when it starts,
# the `[logs]` table to write instead. A config may not have both spellings
# of one file.

# The XMPP (Jabber) gateway: the bot connects to an XMPP server on this host
# as an external component and owns the domain `component` there. The
# owners' XMPP accounts then see every avatar the bot exchanges instant
# messages with as a contact (jane.doe@russel.sl.example.org), local chat as
# the contact local@russel.sl.example.org, and send commands, as
# `rslbot ctl` takes them, to russel.sl.example.org itself. Everyone else is
# refused. The server needs the component in its config; for Prosody:
#   component_interfaces = { "127.0.0.1" }
#   Component "russel.sl.example.org"
#       component_secret = "..."
# `server` is the server's component port (default 127.0.0.1:5347). The
# connection is not encrypted, so it must stay on this host. This is a
# table: it has to come after all the keys above.
# [xmpp]
# component = "russel.sl.example.org"
# server = "127.0.0.1:5347"
# secret = "the component_secret of the server"
# owners = ["me@example.org"]

# The web interface: the bot serves a page at http://<listen>/ with tabs for
# the world around the avatar (status, teleport, scans of avatars and
# objects with teleport, sit and touch), local chat, instant messages, the
# inventory, a command console and the page's theme. `listen` is `host:port`;
# the host is `localhost` or an IP address. With `password` the page asks
# for it before it shows or does anything; without it, whoever reaches the
# address controls the avatar. The connection is not encrypted: keep
# `listen` on 127.0.0.1, and for use from elsewhere put a reverse proxy
# with TLS in front of it and set a password. Several bots on one machine
# need a port each. This is a table: like `[xmpp]`, it has to come after
# all the keys above.
# [web]
# listen = "127.0.0.1:8080"
# password = "choose one"

# Optional: log files. Every message and every transaction is also written
# to standard error. The files are tab-separated, appended to, and created
# when missing; relative paths are relative to the working directory.
# `chat` receives local chat, `im` instant messages, `group` the chat and the
# notices of the avatar's groups, and `transactions` the avatar's L$
# transactions: the payments the bot makes and what the grid
# reports while the avatar is online. The transactions file is also the
# record of the spending limit of `[payments]`: the bot reads it when it
# starts, so moving or editing it renews the limit. This is a table: like
# `[xmpp]`, it has to come after all the keys above.
# [logs]
# chat = "chat.tsv"
# im = "im.tsv"
# group = "group.tsv"
# transactions = "transactions.tsv"

# Optional: payments. Without this table the bot pays nothing. With it,
# `pay`, `prices` and `payees` are carried out for the interfaces `perms`
# lists: "ctl" (`rslbot ctl` and the startup script), "xmpp" (the control
# contact of `[xmpp]`) and "web" (the web interface and its console); an
# empty array lets none of them pay.
#
# `limit` is how many L$ the bot may pay in one period, or "unlimited". A
# number needs `transactions` in `[logs]`: the bot counts what it paid from
# that file, so that a restart does not renew the limit. `limit_renew` is
# the length of a period (`7d`, `12h`, `1d12h`): it starts with the first
# payment that counts and when it is over the whole limit is back. Without
# it the limit never renews.
#
# The lists hold avatars, by login name (`First Last`, `first.last`, or one
# word for a Resident) or UUID, and objects by UUID. A login name is the
# account's name, never a display name, which anybody can set to anything.
# An avatar on a list stands for the objects it owns too.
#   whitelist        Only who is on it (or on `unlimited_list`) can be paid.
#                    Without the key, anybody can.
#   blacklist        Who is on it is never paid.
#   unlimited_list   A payment to who is on it does not count against the
#                    limit.
# [payments]
# limit = 1000
# limit_renew = "7d"
# perms = ["ctl", "web"]
# whitelist = ["Jane Doe", "11111111-2222-3333-4444-555555555555"]
# blacklist = ["john.roe"]
# unlimited_list = ["Owner Resident"]
