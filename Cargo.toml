[package]
name = "russelbot"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "rslbot"
path = "src/main.rs"

[dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }
md-5 = "0.11.0"
quick-xml = "0.42.0"
roxmltree = "0.21.2"
rpassword = "7.5.5"
serde = { version = "1.0.229", features = ["derive"] }
sha1 = "0.11.0"
toml = "1.2.1"
ureq = "3.5.2"
uuid = "1.29.3"
